<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthenics Aesthetics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1 class="fade-in">CALISTHENICS AESTHETICS</h1>
        <p class="slide-up">Unleash Your True Potential</p>
        <button id="dark-mode-toggle">🌙 Toggle Dark Mode</button>
    </header>

    <section id="hero">
        <button id="explore-btn">Explore Workouts</button>
    </section>

    <section id="timer">
        <h2>Live Workout Timer</h2>
        <p id="time-display">00:00</p>
        <button onclick="startTimer()">Start Timer</button>
        <button onclick="resetTimer()">Reset</button>
    </section>

    <footer>
        <p>&copy; 2025 Calisthenics Hackathon</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
